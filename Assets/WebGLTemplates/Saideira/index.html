<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111c32">
  <title>Operação Saideira · Churrasco na Laje</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#0b1222;color:#fff1d0;font-family:system-ui,sans-serif}
    body{display:grid;place-items:center}#game{position:relative;width:min(100vw,177.778vh);height:min(100vh,56.25vw);background:#111c32}
    #game:fullscreen{width:100vw;height:100vh;display:grid;place-items:center}#game:fullscreen canvas{width:min(100vw,177.778vh);height:min(100vh,56.25vw)}canvas{display:block;width:100%;height:100%;outline:0}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111c32;padding:32px;text-align:center}
    .eyebrow{color:#86e6c4;font-size:12px;letter-spacing:.22em}h1{font-size:clamp(22px,5vw,48px);letter-spacing:.03em;margin:18px 0 7px}p{color:#acbdcc;font-size:14px}
    #track{width:min(280px,65vw);height:5px;background:#293b4c;margin-top:22px}#progress{height:100%;width:0;background:#86e6c4;transition:width .2s}
    #error{display:none;max-width:520px;color:#f47a74;line-height:1.6}#fullscreen{position:absolute;right:8px;bottom:8px;border:1px solid #acbdcc60;background:#111c32bb;color:#fff1d0;border-radius:3px;width:28px;height:28px;cursor:pointer;font-size:18px;opacity:.45}#fullscreen:hover,#fullscreen:focus{opacity:1}
  </style>
</head>
<body>
  <main id="game">
    <canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Operação Saideira: Churrasco na Laje. Pegue até três garrafas e leve ao isopor. Use WASD ou setas para mover, Enter para confirmar e Escape para pausar."></canvas>
    <div id="loading" role="status"><div class="eyebrow">CHURRASCO NA LAJE</div><h1>OPERAÇÃO SAIDEIRA</h1><p id="status">Carregando o jogo...</p><div id="track"><div id="progress"></div></div><p id="error"></p></div>
    <button id="fullscreen" title="Tela cheia" aria-label="Tela cheia">⛶</button>
  </main>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const config = {
      matchWebGLToCanvasSize: false,
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    };
    createUnityInstance(canvas, config, progress => {
      document.getElementById('progress').style.width = Math.round(progress * 100) + '%';
      if(progress > .8) document.getElementById('status').textContent = 'Preparando a partida...';
    }).then(instance => {
      window.unityInstance = instance;
      document.getElementById('loading').style.display = 'none';
      canvas.focus();
      document.getElementById('fullscreen').onclick = () => {
        if(document.fullscreenElement) document.exitFullscreen();
        else document.getElementById('game').requestFullscreen().catch(() => instance.SetFullscreen(1));
      };
      canvas.addEventListener('pointerdown', () => canvas.focus());
    }).catch(error => {
      document.getElementById('status').textContent = 'Não foi possível carregar a laje.';
      const notice = document.getElementById('error');
      notice.style.display = 'block';
      notice.textContent = 'Atualize a página e tente novamente em um navegador com WebGL 2. ' + error;
    });
  </script>
</body>
</html>
